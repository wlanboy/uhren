<!DOCTYPE html>
<html lang="de" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meine Uhrensammlung</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>

<body>

    <header>
        <div class="container header-inner">
            <div class="header-brand">
                <strong>Meine Uhrensammlung</strong>
            </div>
            <div class="header-actions">
                <button id="compareBtn" disabled>Vergleichen</button>
                <button id="themeToggle" class="btn-icon" aria-label="Theme wechseln">Theme</button>
            </div>
        </div>
        <div class="filter-bar">
            <div class="container">
                <div id="tagChips" class="tag-chips"></div>
            </div>
        </div>
    </header>

    <main class="container">

        <section>
            <div id="gallery" class="masonry"></div>
        </section>

        <section>
            <h2 class="section-label">Wunschliste</h2>
            <div id="wishlistArea" class="wishlist-grid"></div>
        </section>

    </main>

    <div id="compareTray" class="compare-tray" inert>
        <div class="container compare-tray-inner">
            <div id="compareTraySlots" class="tray-slots"></div>
            <div class="tray-actions">
                <button id="trayClear" class="btn-ghost">Leeren</button>
                <button id="trayOpen" class="btn-primary" disabled>Vergleichen</button>
            </div>
        </div>
    </div>

    <div id="compareOverlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="compareTitle">
        <div class="overlay-inner compare-inner">
            <button class="overlay-close" data-close aria-label="Schließen">✕</button>
            <h2 id="compareTitle">Vergleich</h2>
            <div id="compareArea"></div>
        </div>
    </div>

    <div id="detailOverlay" class="overlay overlay--top" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
        <div class="overlay-inner detail-inner">
            <button class="overlay-close" data-close aria-label="Schließen">✕</button>
            <div id="detailContent"></div>
        </div>
    </div>

</body>

</html>
