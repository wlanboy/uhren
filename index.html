<!DOCTYPE html>
<html lang="de" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meine Uhrensammlung</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>

<body>

    <header>
        <div class="container header-inner">
            <div class="header-brand">
                <strong>Meine Uhrensammlung</strong>
            </div>
            <div class="header-actions">
                <button id="compareBtn" disabled>Vergleichen</button>
                <button id="themeToggle" class="btn-icon" aria-label="Theme wechseln">Theme</button>
            </div>
        </div>
        <div class="filter-bar">
            <div class="container">
                <div id="tagChips" class="tag-chips"></div>
            </div>
        </div>
    </header>

    <main class="container">

        <section>
            <div id="gallery" class="masonry"></div>
        </section>

        <section>
            <h2 class="section-label">Wunschliste</h2>
            <div id="wishlistArea" class="wishlist-grid"></div>
        </section>

    </main>

    <div id="compareOverlay" class="compare-overlay">
        <div class="compare-overlay-inner">
            <button id="overlayClose" class="overlay-close" aria-label="Schließen">✕</button>
            <h2>Vergleich</h2>
            <div id="compareArea" class="compare-grid"></div>
        </div>
    </div>

</body>

</html>
