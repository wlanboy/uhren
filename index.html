<!DOCTYPE html>
<html lang="de" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Meine Uhrensammlung</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>

<body>

    <main class="container">

        <section class="hero">
            <div class="hero-text">
                <p class="eyebrow">Private Sammlung</p>
                <h1>Meine Uhren</h1>
                <dl id="stats" class="stats"></dl>
            </div>
            <div class="hero-actions">
                <button id="compareBtn" class="btn-primary" disabled>Vergleichen</button>
                <button id="themeToggle" class="btn-icon" aria-label="Farbschema wechseln" title="Farbschema wechseln">
                    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                </button>
            </div>
        </section>

        <section class="filter-bar" aria-label="Filter">
            <div id="tagChips" class="tag-chips"></div>
        </section>

        <section>
            <div id="gallery" class="gallery"></div>
        </section>

        <section id="wishlistSection" hidden>
            <h2 class="section-label">Wunschliste</h2>
            <div id="wishlistArea" class="gallery"></div>
        </section>

    </main>

    <div id="compareTray" class="compare-tray" inert>
        <div class="compare-tray-inner">
            <div id="compareTraySlots" class="tray-slots"></div>
            <div class="tray-actions">
                <button id="trayClear" class="btn-ghost">Leeren</button>
                <button id="trayOpen" class="btn-primary" disabled>Vergleichen</button>
            </div>
        </div>
    </div>

    <div id="compareOverlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="compareTitle">
        <div class="overlay-inner compare-inner">
            <button class="overlay-close" data-close aria-label="Schließen">✕</button>
            <h2 id="compareTitle">Vergleich</h2>
            <div id="compareArea"></div>
        </div>
    </div>

    <div id="detailOverlay" class="overlay overlay--top" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
        <div class="overlay-inner detail-inner">
            <button class="overlay-close" data-close aria-label="Schließen">✕</button>
            <div id="detailContent"></div>
        </div>
    </div>

</body>

</html>
